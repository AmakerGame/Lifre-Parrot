name: Build exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/Lifre.Start/Lifre.Start.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: StartLifre-exe
          path: dist/StartLifre.exe
